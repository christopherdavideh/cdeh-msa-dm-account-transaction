server:
  port: 8082
spring:
  application:
    name: cdeh-msa-dm-account-transaction
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/bdd_account_transaction
    username: postgres
    password: postgres
    pool:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/bdd_account_transaction
    user: postgres
    password: postgres
    validate-on-migrate: true

